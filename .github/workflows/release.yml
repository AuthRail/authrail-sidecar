name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without v prefix'
        required: true
        default: '0.1.0'
        type: string
      publish:
        description: 'Publish after checks (requires matching tag and publisher setup)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'AuthRail/authrail-sidecar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify version and release identity
        id: verify
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PYCODE'
          import json, os, re, subprocess
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use an exact MAJOR.MINOR.PATCH version.')
          assert 'module github.com/AuthRail/authrail-sidecar' in open('go.mod').read()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          if os.environ['PUBLISH'] == 'true':
              tagged = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/v{version}' + '^{commit}'], text=True).strip()
              if tagged != sha:
                  raise SystemExit('The release tag must already point to this exact main commit.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nversion={version}\n')
          PYCODE

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  native:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Package native binary with version and revision
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sh scripts/package.sh "$VERSION" "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native/*.tar.gz
            ${{ runner.temp }}/native/*.sha256
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: authrail-sidecar
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: AuthRail/authrail-sdk-node
          ref: f1d834ea6c5f74b7033097ac851f6c4b6b3debd6
          path: authrail-sdk-node
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: AuthRail/authrail-sdk-go
          ref: 9afa9a18cfde13d31e1a9e930ad64bfd2c12f88e
          path: authrail-sdk-go
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: authrail-sdk-node/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci && npm run build
        working-directory: authrail-sdk-node
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: authrail-sidecar
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: authrail-sidecar:candidate
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.sha }}
      - name: Verify distribution identity and run container integration
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        working-directory: authrail-sidecar
        run: |
          docker run --rm authrail-sidecar:candidate --version > "$RUNNER_TEMP/version.json"
          python -c 'import json, os; v=json.load(open(os.environ["RUNNER_TEMP"]+"/version.json")); assert v["version"] == os.environ["VERSION"]; assert v["revision"] == os.environ["REVISION"]'
          docker pull --platform "linux/$ARCH" node:22-slim
          python scripts/docker-smoke.py authrail-sidecar:candidate
          python scripts/docker-sdk-smoke.py authrail-sidecar:candidate
      - name: Preserve the tested image
        run: |
          mkdir image
          docker save authrail-sidecar:candidate | gzip > image/image.tar.gz
          cd image
          sha256sum image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-${{ matrix.arch }}
          path: image/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: [prepare, native, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          pattern: '{native-*,image-*}'
      - name: Publish the tested images and native archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          image=ghcr.io/authrail/authrail-sidecar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for tag in "$VERSION" "$VERSION-amd64" "$VERSION-arm64"; do
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo 'Version already exists; reconcile a partial release before retrying.' >&2
              exit 1
            fi
          done
          for directory in artifacts/native-*; do
            (cd "$directory" && sha256sum -c ./*.sha256)
          done
          for arch in amd64 arm64; do
            (cd "artifacts/image-$arch" && sha256sum -c SHA256SUMS)
            docker load -i "artifacts/image-$arch/image.tar.gz"
            test "$(docker image inspect authrail-sidecar:candidate --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$REVISION"
            test "$(docker image inspect authrail-sidecar:candidate --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
            docker tag authrail-sidecar:candidate "$image:$VERSION-$arch"
            docker push "$image:$VERSION-$arch"
          done
          docker manifest create "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker manifest push "$image:$VERSION"
          printf 'AuthRail sidecar %s. Docker image: `%s:%s`. Pin the published image digest for deployment. Native archives include manifests and SHA-256 checksums. See COMPATIBILITY.md for tested integrations.\n' "$VERSION" "$image" "$VERSION" > notes.md
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md \
            artifacts/native-*/*.tar.gz artifacts/native-*/*.sha256
